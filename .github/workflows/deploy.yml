name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same branch overlap; queue instead of cancelling
# so the last push always wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Проверка на секретите
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Липсват repository secrets: ${missing[*]}. Добави ги в Settings → Secrets and variables → Actions (виж README)."
            exit 1
          fi

      - run: npm ci

      - name: Тестове
        run: npm test

      - name: Билд
        run: npm run build

      - name: Деплой
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler deploy | tee deploy.log
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Деплойнато"
            if [ -n "$url" ]; then echo "$url"; else echo "Работи на собствен домейн (routes в wrangler.jsonc)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
